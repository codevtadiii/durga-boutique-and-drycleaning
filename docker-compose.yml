services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-durga_business}
      POSTGRES_USER: ${POSTGRES_USER:-durga_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-durga_app} -d ${POSTGRES_DB:-durga_business}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://durga_app:local-development-only@db:5432/durga_business}
      SESSION_SECRET: ${SESSION_SECRET:-replace-with-a-random-secret-before-use}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Kolkata}
      MEDIA_ROOT: ${MEDIA_ROOT:-/data/media}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      AUTO_CREATE_SCHEMA: ${AUTO_CREATE_SCHEMA:-true}
      SHOP_WHATSAPP_NUMBER: ${SHOP_WHATSAPP_NUMBER:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - media_data:/data/media
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://durga_app:local-development-only@db:5432/durga_business}
      SESSION_SECRET: ${SESSION_SECRET:-replace-with-a-random-secret-before-use}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Kolkata}
      MEDIA_ROOT: ${MEDIA_ROOT:-/data/media}
    volumes:
      - ./backend:/app
      - media_data:/data/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
  frontend_node_modules:
